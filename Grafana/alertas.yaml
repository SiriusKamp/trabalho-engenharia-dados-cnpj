# Montar em /etc/grafana/provisioning/alerting/alertas.yaml.
# Parser backend permite avaliar regras sem navegador. O histórico é cumulativo;
# o alerta usa falhas_atuais para voltar ao normal depois de uma retomada concluída.
# Referência: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
apiVersion: 1
groups:
  - orgId: 1
    name: CNPJ operacional
    folder: CNPJ
    interval: 1m
    rules:
      - uid: cnpj-falha-pipeline
        title: CNPJ com falha pendente
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Alerting
        isPaused: false
        dashboardUid: cnpj-operacional
        panelId: 1
        annotations:
          summary: Há falha pendente no pipeline CNPJ
          description: Consulte os metadados restritos e reative a manutenção com o perfil de engenharia.
        labels:
          servico: cnpj
          severidade: erro
        data:
          - refId: A
            datasourceUid: cnpj-api
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: yesoreyeram-infinity-datasource
                uid: cnpj-api
              type: json
              parser: backend
              source: url
              url: http://app:8000/metricas/resumo
              url_options:
                method: GET
              format: table
              root_selector: '$append([], $)'
              columns:
                - selector: falhas_atuais
                  text: falhas_atuais
                  type: number
              summarizeExpression: last(falhas_atuais)
              summarizeAlias: falhas_atuais
              intervalMs: 60000
              maxDataPoints: 1
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 60000
              maxDataPoints: 1
